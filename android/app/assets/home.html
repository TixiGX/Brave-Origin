<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brave Origin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e0e10;
    color: #f2f2f4;
    font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 28px;
  }
  .mark {
    width: 88px; height: 88px;
    border-radius: 24px;
    background: #17171a;
    border: 1px solid #2e2e33;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 48px; height: 48px; }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .sub { margin: 6px 0 0; color: #9a9aa2; font-size: 13px; text-align: center; }
  form {
    width: 100%; max-width: 520px;
    display: flex; gap: 8px;
  }
  input {
    flex: 1; min-width: 0;
    height: 48px;
    padding: 0 18px;
    border-radius: 24px;
    border: 1px solid #2e2e33;
    background: #232327;
    color: #f2f2f4;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #d8b26a; }
  button {
    height: 48px;
    padding: 0 22px;
    border-radius: 24px;
    border: 0;
    background: #d8b26a;
    color: #14110a;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .head { display: flex; flex-direction: column; align-items: center; }
  footer {
    position: fixed; bottom: 16px; left: 0; right: 0;
    text-align: center; color: #6c6c74; font-size: 11px;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.6 4.2 6.1l1.1 6.3 1.6 1-1.1 2 3.3 3.2-.5 2.1L12 21.4l3.4-.7-.5-2.1 3.3-3.2-1.1-2 1.6-1 1.1-6.3L12 2.6Z" stroke="#d8b26a" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M9.2 9.1h5.6M9.5 12h5M10 14.9h4" stroke="#d8b26a" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Brave Origin</h1>
    <p class="sub">Privacy al centro, solo le funzioni che ti servono.</p>
  </div>

  <form onsubmit="go(event)">
    <input id="q" type="search" placeholder="Cerca con Brave Search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Cerca</button>
  </form>

  <footer>Brave Origin per Android &middot; motore WebView di sistema</footer>

  <script>
    function go(e) {
      e.preventDefault();
      var q = document.getElementById('q').value.trim();
      if (!q) return;
      window.location.href = 'https://search.brave.com/search?q=' + encodeURIComponent(q);
    }
  </script>
</body>
</html>
