name: Publish Brave Origin release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "branding/**"

permissions:
  contents: write

env:
  VERSION: v1.99.57
  TAG: v1.99.57
  DESKTOP_ASSETS: >-
    BraveOriginStandaloneSetup.exe BraveOriginSetup.exe BraveOriginStandaloneSetupArm64.exe
    Brave-Origin-x64.dmg Brave-Origin-arm64.dmg
  ANDROID_UPSTREAM_ASSETS: >-
    BraveMonoarm64.apk BraveMonoarm.apk BraveMonox64.apk BraveMonox86.apk

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Rileva Android SDK Build-Tools e Platform
        id: sdk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_VER=""
          for v in $(ls -1 "$SDK/build-tools" | sort -V); do
            if [ -x "$SDK/build-tools/$v/aapt2" ] && [ -x "$SDK/build-tools/$v/d8" ] && [ -x "$SDK/build-tools/$v/dexdump" ]; then
              BT_VER="$v"
            fi
          done
          PLAT_VER=""
          for p in $(ls -1 "$SDK/platforms" | sort -V); do
            if [ -f "$SDK/platforms/$p/android.jar" ]; then
              PLAT_VER="$p"
            fi
          done
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VER=$BT_VER" >> "$GITHUB_ENV"
          echo "PLATFORM_VER=$PLAT_VER" >> "$GITHUB_ENV"
          echo "::notice title=AndroidSDK::SDK=$SDK build-tools=$BT_VER platform=$PLAT_VER"

      - name: Scarica le APK ufficiali Brave Android e verifica SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist out
          base="https://github.com/brave/brave-browser/releases/download/${VERSION}"

          # Scarica sempre le 4 APK upstream ufficiali BraveMono* per generare BraveOrigin-*.apk
          for name in $ANDROID_UPSTREAM_ASSETS; do
            echo "-> Scaricamento $name"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "dist/$name" "$base/$name"
          done

          # Scarica gli installer desktop solo se la release non li possiede ancora
          existing_names=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          fi
          for name in $DESKTOP_ASSETS; do
            if ! grep -qx "$name" <<<"$existing_names"; then
              echo "-> Scaricamento desktop mancante: $name"
              curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "dist/$name" "$base/$name"
            fi
          done

          # Verifica rigorosa SHA-256 sui file upstream scaricati
          awk '{n = split($2, p, "/"); print $1 "  " p[n]}' installers/v1.99.57/SHA256SUMS.txt > dist/SHA256SUMS.txt
          (
            cd dist
            for f in *.apk *.exe *.dmg; do
              [ -f "$f" ] || continue
              grep "  $f\$" SHA256SUMS.txt | sha256sum -c -
            done
          )

      - name: Genera e verifica BraveOrigin APK (arm64, arm, x64, x86)
        run: |
          set -euo pipefail
          emit_report() {
            if [ -f out/build-report.txt ]; then
              python3 - <<'PY'
          from pathlib import Path
          txt = Path("out/build-report.txt").read_text(errors="replace")[-3800:]
          enc = txt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=BuildReport::{enc}")
          PY
            fi
          }
          trap emit_report EXIT

          declare -A ARCH_MAP=(
            ["BraveMonoarm64.apk"]="BraveOrigin-arm64.apk"
            ["BraveMonoarm.apk"]="BraveOrigin-arm.apk"
            ["BraveMonox64.apk"]="BraveOrigin-x64.apk"
            ["BraveMonox86.apk"]="BraveOrigin-x86.apk"
          )

          for src_name in BraveMonoarm64.apk BraveMonoarm.apk BraveMonox64.apk BraveMonox86.apk; do
            dst_name="${ARCH_MAP[$src_name]}"
            echo "============================================================" | tee -a out/build-report.txt
            echo "Patching $src_name -> $dst_name" | tee -a out/build-report.txt
            echo "============================================================" | tee -a out/build-report.txt
            python3 scripts/patch_brave_origin_apk.py \
              --input "dist/$src_name" \
              --output "out/$dst_name" \
              --android-home "$ANDROID_SDK" \
              --build-tools-ver "$BUILD_TOOLS_VER" \
              --platform-ver "$PLATFORM_VER" \
              --java-home "$JAVA_HOME" 2>&1 | tee -a out/build-report.txt

            python3 scripts/verify_patched_apk.py \
              --apk "out/$dst_name" \
              --upstream-apk "dist/$src_name" \
              --android-home "$ANDROID_SDK" \
              --build-tools-ver "$BUILD_TOOLS_VER" \
              --platform-ver "$PLATFORM_VER" \
              --java-home "$JAVA_HOME" 2>&1 | tee -a out/build-report.txt
          done

          (
            cd out
            sha256sum BraveOrigin-*.apk > BraveOrigin-Android-SHA256SUMS.txt
            cat BraveOrigin-Android-SHA256SUMS.txt | tee -a build-report.txt
          )

      - name: Salva report di verifica come artifact CI
        uses: actions/upload-artifact@v4
        with:
          name: brave-origin-verification-report
          path: |
            out/build-report.txt
            out/BraveOrigin-Android-SHA256SUMS.txt

      - name: Crea o aggiorna la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Aggiornamento note release $TAG"
            gh release edit "$TAG" \
              --title "Brave Origin $VERSION" \
              --notes-file .github/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Brave Origin $VERSION" \
              --notes-file .github/release-notes.md
          fi

          # Rimuove eventuali asset obsoleti o APK upstream grezze per compatibilità diretta con Obtainium
          for old_asset in \
            "BraveOrigin-1.0.0-universal.apk" \
            "BraveOrigin-1.99.57-universal.apk" \
            "BraveMonoarm64.apk" \
            "BraveMonoarm.apk" \
            "BraveMonox64.apk" \
            "BraveMonox86.apk"; do
            gh release delete-asset "$TAG" "$old_asset" --yes >/dev/null 2>&1 || true
          done

          # Carica sempre le nuove APK ufficiali BraveOrigin-*.apk e i relativi SHA-256
          gh release upload "$TAG" \
            out/BraveOrigin-arm64.apk \
            out/BraveOrigin-arm.apk \
            out/BraveOrigin-x64.apk \
            out/BraveOrigin-x86.apk \
            out/BraveOrigin-Android-SHA256SUMS.txt \
            dist/SHA256SUMS.txt \
            --clobber

          # Carica eventuali installer desktop mancanti
          existing="$(mktemp)"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' > "$existing"
          upload=()
          for f in dist/*.exe dist/*.dmg; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            size="$(stat -c%s "$f")"
            if ! grep -qx "$name $size" "$existing"; then
              upload+=("$f")
            fi
          done
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --clobber
          fi

      - name: Registra gli asset pubblicati nel repository (solo su main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "# Release $VERSION"
            echo
            echo "Pagina release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "Ultimo aggiornamento: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Asset | Byte |"
            echo "|---|---:|"
            gh release view "$TAG" --json assets --jq '.assets | sort_by(.name)[] | "| `\(.name)` | \(.size) |"'
          } > installers/RELEASED.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/RELEASED.md
          if ! git diff --cached --quiet; then
            git commit -m "Record published release assets for $VERSION"
            git push origin "${GITHUB_REF_NAME}"
          fi
