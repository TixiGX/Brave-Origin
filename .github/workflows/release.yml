name: Publish Brave Origin release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

env:
  VERSION: v1.99.57
  TAG: v1.99.57
  ASSETS: >-
    BraveOriginStandaloneSetup.exe BraveOriginSetup.exe BraveOriginStandaloneSetupArm64.exe
    Brave-Origin-x64.dmg Brave-Origin-arm64.dmg
    BraveMonoarm64.apk BraveMonoarm.apk BraveMonox64.apk BraveMonox86.apk

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica gli installer ufficiali Brave Origin
        run: |
          set -euo pipefail
          mkdir -p dist
          base="https://github.com/brave/brave-browser/releases/download/${VERSION}"
          for name in $ASSETS; do
            echo "-> $name"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "dist/$name" "$base/$name"
          done
          ls -lh dist

      - name: Verifica SHA-256 con i checksum del repository
        run: |
          set -euo pipefail
          cd dist
          awk '{n = split($2, p, "/"); print $1 "  " p[n]}' ../installers/v1.99.57/SHA256SUMS.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Crea la release se non esiste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gia' esistente"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Brave Origin $VERSION" \
              --notes-file .github/release-notes.md
          fi

      - name: Carica solo gli asset mancanti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(mktemp)"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' > "$existing"
          upload=()
          for f in dist/*.exe dist/*.dmg dist/*.apk dist/SHA256SUMS.txt android/BraveOrigin-1.99.57-universal.apk; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            size="$(stat -c%s "$f")"
            if grep -qx "$name $size" "$existing"; then
              echo "gia' presente: $name"
            else
              echo "da caricare: $name ($size byte)"
              upload+=("$f")
            fi
          done
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --clobber
          else
            echo "Nessun asset da caricare"
          fi

      - name: Registra gli asset pubblicati nel repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "# Release $VERSION"
            echo
            echo "Pagina release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "Ultimo aggiornamento: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Asset | Byte |"
            echo "|---|---:|"
            gh release view "$TAG" --json assets --jq '.assets | sort_by(.name)[] | "| `\(.name)` | \(.size) |"'
          } > installers/RELEASED.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/RELEASED.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare"
          else
            git commit -m "Record published release assets for $VERSION"
            git push origin HEAD:main
          fi
